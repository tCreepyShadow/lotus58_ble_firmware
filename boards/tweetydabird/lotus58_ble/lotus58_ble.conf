# Enables the encoder.
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Enables the nice!view display.
CONFIG_ZMK_DISPLAY=y

# Enables ZMK Studio support.
CONFIG_ZMK_STUDIO=y

# Enables deep sleep.
CONFIG_ZMK_SLEEP=y

# Enables n-key rollover.
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=y

# Enables the underglow LEDs, sets the starting brightness to 20 percent and the starting effect to "Spectrum".
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=20
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=2