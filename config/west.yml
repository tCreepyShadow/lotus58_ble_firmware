manifest:
  defaults:
    revision: v0.3
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    # Additional modules containing boards/shields/custom code can be listed here as well
    # See https://docs.zephyrproject.org/3.2.0/develop/west/manifest.html#projects
  projects:
    - name: zmk
      remote: zmkfirmware
      # this is needed since otherwise ZMK 0.3 is used, meaning Zephyr 3.5, which doesn't use the hwmv2.
      revision: main
      import: app/west.yml
  self:
    path: config